[project]
name = "invoice-ocr-backend"
version = "0.1.0"
description = "Invoice OCR Viewer API - PaddleOCR-VL pipeline with MLX-VLM recognition on Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "nh3>=0.2.18",
    "paddleocr[doc-parser]>=3.2.0",
    "paddlepaddle==3.2.1",
    "psycopg[binary,pool]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
paddlepaddle = { index = "paddlecpu" }

[[tool.uv.index]]
name = "paddlecpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
